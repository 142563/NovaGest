# Pipeline de integracion: corre todas las pruebas en cada pull request y en cada push a develop o main.
# El plan exige "pipeline en verde" antes de mezclar. Para que sea obligatorio, en GitHub (Settings > Rules)
# se marca "Require status checks to pass" con la verificacion "Compilar y probar".
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verificar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Las pruebas usan Testcontainers: levantan PostgreSQL en Docker, que ya viene en el runner.
      - name: Compilar y correr las pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      # Evidencia para el informe de auditoria: la matriz de rol por endpoint que genera el test.
      - name: Guardar la matriz de roles por endpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matriz-roles-endpoints
          path: target/matriz-roles-endpoints.md
          if-no-files-found: ignore

      - name: Guardar reportes de pruebas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: target/surefire-reports
          if-no-files-found: ignore
