# Pruebas: la base la levanta Testcontainers (@ServiceConnection), no se usan las variables DB_*
logging.level.org.flywaydb=info

# Clave solo para pruebas automaticas (no es un secreto real; produccion usa la variable JWT_SECRET)
app.jwt.secret=clave-solo-para-pruebas-automaticas-0123456789

# Tarjeta 22: las pruebas nunca llaman al Banguat real. Esta direccion no responde (conexion rechazada al
# instante), asi que sin datos guardados se prueba el respaldo; las pruebas que necesitan al Banguat levantan
# un servidor local con las respuestas grabadas de docs/banguat/muestras/.
app.banguat.url=http://127.0.0.1:9/variables/ws/TipoCambio.asmx
app.banguat.tiempo-espera=1s
app.banguat.reintentos=0
app.banguat.pausa-entre-reintentos=0ms
