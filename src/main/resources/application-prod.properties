# Produccion: todas las variables DB_* son obligatorias, sin valores por defecto
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Tarjeta 5: en produccion no se publica la documentacion de la API (menos superficie de ataque)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
